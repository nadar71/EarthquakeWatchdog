name: Enable Linux KVM access
description: Grant GitHub-hosted Ubuntu runners access to hardware virtualization.

runs:
  using: composite
  steps:
    - name: Configure KVM device permissions
      shell: bash
      run: |
        set -euo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
