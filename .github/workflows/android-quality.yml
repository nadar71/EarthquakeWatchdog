name: Android Quality

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify repository hygiene
        run: bash scripts/verify_repository_hygiene.sh

      - name: Verify GitHub Actions security contract
        run: python3 scripts/tests/verify_github_actions_test.py

  unit-lint-build:
    name: unit-lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Run unit tests, lint, and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload unit and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-lint-build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
