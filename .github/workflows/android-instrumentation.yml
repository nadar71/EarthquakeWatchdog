name: Android Instrumentation

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
    -Dorg.gradle.workers.max=2

concurrency:
  group: android-instrumentation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  instrumentation:
    name: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Linux KVM access
        uses: ./.github/actions/enable-kvm

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Restore API 35 emulator cache
        id: api-35-avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-api-35

      - name: Run API 35 instrumentation suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on
          script: bash scripts/run_instrumentation_ci.sh

      - name: Save API 35 emulator cache
        if: github.event_name != 'pull_request' && steps.api-35-avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-api-35

      - name: Upload API 35 instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-api-35-reports
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            ci-logs/instrumentation.log
          if-no-files-found: warn
          retention-days: 7

  compatibility-instrumentation:
    name: compatibility-api-${{ matrix.api-level }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Linux KVM access
        uses: ./.github/actions/enable-kvm

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Restore API ${{ matrix.api-level }} emulator cache
        id: compatibility-avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-api-${{ matrix.api-level }}

      - name: Run API ${{ matrix.api-level }} instrumentation suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on
          script: bash scripts/run_instrumentation_ci.sh

      - name: Save API ${{ matrix.api-level }} emulator cache
        if: steps.compatibility-avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-api-${{ matrix.api-level }}

      - name: Upload API ${{ matrix.api-level }} instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-api-${{ matrix.api-level }}-reports
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            ci-logs/instrumentation.log
          if-no-files-found: warn
          retention-days: 7

  benchmark-monitoring:
    name: benchmark-monitoring-non-blocking
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Linux KVM access
        uses: ./.github/actions/enable-kvm

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Restore API 35 benchmark emulator cache
        id: benchmark-avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: benchmark-avd-v2-${{ runner.os }}-api-35

      - name: Run selector, profile, and Macrobenchmark monitoring
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on
          script: bash scripts/run_benchmark_monitoring_ci.sh

      - name: Save API 35 benchmark emulator cache
        if: steps.benchmark-avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: benchmark-avd-v2-${{ runner.os }}-api-35

      - name: Upload benchmark monitoring evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-monitoring-evidence
          path: |
            benchmark-results/
            benchmark/build/reports/androidTests/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/outputs/connected_android_test_additional_output/
            app/src/release/generated/baselineProfiles/
          if-no-files-found: warn
          retention-days: 14
